<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فروشگاه اکانت eFootball</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
        }

        header {
            background: #151b24;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #293241;
        }

        header h1 {
            margin: 0;
            color: #4ade80;
        }

        .container {
            max-width: 500px;
            margin: 25px auto;
            padding: 15px;
        }

        .account {
            background: #161d27;
            border: 1px solid #293241;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        .account img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .account-info {
            padding: 18px;
        }

        .account-info h2 {
            margin-top: 0;
            color: #4ade80;
        }

        .info {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #293241;
        }

        .buy-button {
            display: block;
            text-align: center;
            background: #22c55e;
            color: white;
            text-decoration: none;
            padding: 13px;
            border-radius: 10px;
            margin-top: 18px;
            font-weight: bold;
        }

        .buy-button:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

<header>
    <h1>فروشگاه اکانت eFootball</h1>
    <p>اکانت‌های موجود</p>
</header>

<div class="container">

    <div class="account">

        <img src="htt.jpg" alt="عکس"> اکانت">

        <div class="account-info">

            <h2>اکانت شماره ۱</h2>

            <div class="info">
                <span>ریجن</span>
                <strong>ژاپن</strong>
            </div>

            <div class="info">
                <span>سیو</span>
                <strong>کونامی</strong>
            </div>

            <div class="info">
                <span>لاگ</span>
                <strong>۱۰</strong>
            </div>

            <div class="info">
                <span>کوین</span>
                <strong>۱۰۰</strong>
            </div>

            <a class="buy-button" href="#">
                مشاهده / درخواست خرید
            </a>

        </div>
    </div>

</div>

</body>
</html>
